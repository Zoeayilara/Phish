[build]
  command = "pip install -r requirements-prod.txt && python manage.py collectstatic --noinput && python manage.py migrate"
  publish = "staticfiles/"

[build.environment]
  PYTHON_VERSION = "3.9"
  DJANGO_SETTINGS_MODULE = "phishguard.settings_production"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/**"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/test"
  to = "/.netlify/functions/test"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/django"
  status = 200
