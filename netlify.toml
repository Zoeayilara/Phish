[build]
  base = ""
  command = "cd phishguard && python manage.py collectstatic --noinput && python manage.py migrate"
  publish = "phishguard/staticfiles/"

[build.environment]
  PYTHON_VERSION = "3.9"
  DJANGO_SETTINGS_MODULE = "phishguard.settings_production"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
